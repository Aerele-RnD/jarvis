function render(){const [name,url]=providers[Number(el('provider').value)||0];const copy=current.variants[Number(el('provider').value)||0];document.querySelectorAll('.scenario').forEach(b=>{const active=b.dataset.id===current.id;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});el('scenario-title').textContent=current.label;el('provider-control').hidden=!current.provider;el('card').hidden=current.id==='cancelled';el('cancelled').hidden=current.id!=='cancelled';el('headline').textContent=copy.headline;el('hint').textContent=copy.hint;el('hint').hidden=!copy.hint;el('raw').textContent=current.detail;el('details').open=false;el('status').hidden=!(current.provider&&url);if(current.provider&&url){el('status').href=url;el('status').textContent='Check '+name+' status ↗'}else{el('status').removeAttribute('href')}el('retry').hidden=!copy.retryable;el('modelpill').textContent=name+'  ⌄';el('toast').hidden=true;let note='Preview only. Details are sample errors; Retry does not send a request.';if(current.provider&&!url){note+=' No verified public status link is configured for this connection.';}el('note').textContent=note;}
